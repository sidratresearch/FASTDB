    batch_size: 10 # 1000 in nserc
    survey: lsst # important!
    topic_name: loop # important! "alerts" in nserc, but that doesn't seem to have anything coming through right now
    max_workers: 2
    pollkwargs:
      restart_time_min: 0.16667 # 30 in nserc
      max_restarts: null

  pitt-google-uniform_sample:
    class: PittGoogleConsumer
